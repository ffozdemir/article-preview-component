<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Frontend Mentor | Article preview component</title>
  </head>
  <body>
    <main>
      <section class="card">
        <div class="card-image">
          <img
            class="card-image-element"
            src="./images/drawers.jpg"
            alt="green drawer with photo frames"
          />
        </div>
        <div class="card-content">
          <div class="card-text">
            <h2>
              Shift the overall look and feel by adding these wonderful touches to
              furniture in your home
            </h2>
            <p>
              Ever been in a room and felt like something was missing? Perhaps it
              felt slightly bare and uninviting. I’ve got some simple tips to help
              you make any room feel complete.
            </p>
          </div>
          <div class="card-author">
            <div class="author-info">
            <img
              src="./images/avatar-michelle.jpg"
              alt="avatar-michelle"
              id="author-image"
            />
              <div class="author-details">
                <p>Michelle Appleton</p>
                <time datetime="2020-06-28">28 Jun 2020</time>
              </div>
            </div>
            <!-- <div class="social-links">
              <a href="#">SHARE</a>
              <img src="./images/icon-facebook.svg" alt="icon-facebook" />
              <img src="./images/icon-twitter.svg" alt="icon-twitter" />
              <img src="./images/icon-pinterest.svg" alt="icon-pinterest" />
            </div> -->
            <img src="./images/icon-share.svg" alt="icon-share" id="icon-share" />
          </div>
        </div>
      </section>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
